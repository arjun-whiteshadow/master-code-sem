# Growth conditions against the Method 1 morphology clusters.
# Settings are described in ../PROTOCOL.md.

random_seed: 42

input:
  # One row per sample with the MBE growth parameters. Column names are
  # listed under `parameters` below; see DATA_DICTIONARY.md.
  growth_log: ../method1/data/growth_conditions.xlsx
  sample_id_column: Sample
  # Method 1 must have been run: the descriptor table, cluster assignments
  # and fitted model are read from here.
  method1_results: ../method1/results

parameters:
  # Enter the correlation, regression and per-cluster tests.
  numeric:
    - Substrate_Temperature_C
    - Ga_BEP_Torr
    - As_BEP_Torr
    - Sb_BEP_Torr
    - Growth_Time_min
  # Enter the per-cluster test only.
  categorical:
    - Substrate
  # A parameter with fewer valid values than this fraction of the merged
  # samples is left out and the exclusion reported. Missing values in a
  # retained parameter drop that sample from the tests that use it.
  min_valid_fraction: 0.80

# Two parameters whose Spearman |rho| across the runs reaches this value are
# reported as not separable, and a parameter whose |rho| with growth date
# reaches it is reported as drifting. The tests still run on all of them;
# the flags are carried into the summary so the reader sees them.
confound_threshold: 0.70

tests:
  # Benjamini-Hochberg adjusted p (q) below this is reported as significant.
  # Adjustment is within each family: the descriptor-parameter grid, the
  # per-cluster numeric tests, and the per-cluster categorical tests.
  alpha: 0.05
  # Label shuffles for the exact test of a categorical parameter against
  # the clusters.
  n_permutations: 10000

regime_map:
  # The two parameters the clusters are drawn against. Leave empty to take
  # the two with the smallest per-cluster Kruskal-Wallis p-value; name two
  # parameters to fix the axes in advance.
  axes: []

output:
  results_folder: results
  figure_dpi: 300
